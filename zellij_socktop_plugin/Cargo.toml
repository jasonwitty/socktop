[package]
name = "zellij_socktop_plugin"
version = "0.1.0"
edition = "2021"

# Standalone package, not part of the parent workspace (same as socktop_wasm_test)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zellij-tile = "0.40.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socktop_connector = { path = "../socktop_connector", default-features = false, features = ["wasm"] }
futures = "0.3"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock", "std", "wasmbind"]
