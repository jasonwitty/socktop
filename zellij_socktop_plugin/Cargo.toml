[package]
name = "zellij_socktop_plugin"
version = "0.1.0"
edition = "2021"

# Standalone package, not part of the parent workspace (same as socktop_wasm_test)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zellij-tile = "0.45.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socktop_connector = { path = "../socktop_connector", default-features = false, features = ["wasm"] }
futures = "0.3"

# zellij-utils depends on uuid, which needs an explicit randomness source on
# wasm32-unknown-unknown. Adding it here feature-unifies with zellij-utils and
# makes the plugin link (uuid's js backend uses the host's crypto.getRandomValues).
uuid = { version = "1", features = ["js"] }

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock", "std", "wasmbind"]
