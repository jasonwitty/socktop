[workspace]
resolver = "2"
members = [
    "socktop",
    "socktop_agent",
    "socktop_connector"
]

[workspace.dependencies]
# async + streams
# Features are decided by each member, not here: `full` turns on every tokio
# subsystem for every crate that asks for tokio, and `cargo install socktop` then
# builds a TUI that never uses any of them. The agent already listed its own.
tokio = { version = "1" }
futures-util = "0.3"
anyhow = "1.0"

# websocket
tokio-tungstenite = { version = "0.24", features = ["__rustls-tls", "connect"] }
url = "2.5"

# JSON + error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# system stats (align across crates)
sysinfo = "0.37"

# CLI UI
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

# web server (remote-agent)
axum = { version = "0.7", features = ["ws"] }

# protobuf
prost = "0.13"
dirs-next = "2"

# compression
flate2 = "1.0"

# TLS
# One crypto provider for the whole workspace. rustls' default feature set
# selects aws-lc-rs, and the agent used to ask for it explicitly on top of
# this "ring" line, so both providers were compiled into every binary that
# links rustls (see the agent manifest for the size numbers).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
rustls-pemfile = "2.1"

[profile.release]
# Favor smaller, simpler binaries with good runtime perf
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "symbols"